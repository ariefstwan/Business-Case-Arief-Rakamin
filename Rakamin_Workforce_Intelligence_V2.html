.target-skill-table { min-width: 1390px; }.target-skill-table td:nth-child(5) { min-width: 250px; }.ai-affected-cell { position: relative; }.assignment-cell { padding-right: 62px !important; }.assignment-cell .treatment-select { min-width: 155px; }.participant-name-cell.ai-affected-cell { padding-right: 52px !important; }.cell-corner-remark { position: absolute !important; z-index: 2; top: -1px; right: -1px; min-height: 27px; padding: 5px 10px; border: 0; border-radius: 0 0 0 8px; box-shadow: -2px 2px 0 rgb(36 95 121 / 16%), 0 2px 8px rgb(36 95 121 / 10%); font-size: 11px; font-weight: 850; letter-spacing: .06em; }.cell-corner-remark > i { display: none; }.cell-corner-remark.ai-shine { color: #0b5d7c; background: #d9f2fc; }.cell-corner-remark.ai-shine::after { width: 18px; animation-name: ai-corner-shine; animation-duration: 2.5s; }.manager-confirmation-action { display: flex; min-width: 190px; align-items: center; gap: 8px; }.manager-confirmation-action .primary-button { white-space: nowrap; }.manager-confirmation-action .status-chip { flex: 0 0 auto; }.target-skill-actions { background: var(--surface-soft); }
.recommended-actions { display: grid; gap: 13px; padding: 17px 19px 19px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: #f8faf9; }.recommended-actions-heading h2 { margin: 2px 0 5px; font-size: 21px; }.recommended-actions-heading p { margin: 0; color: var(--muted); font-size: 13px; }.recommended-action-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }.recommended-action-card { display: grid; align-content: start; gap: 9px; min-height: 174px; padding: 15px; border: 1px solid #d3dfdb; border-radius: 8px; background: #fff; }.recommended-action-card.disabled { border-color: #dfe3e1; background: #f3f5f4; }.recommended-action-card-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; }.recommended-action-card-heading > span { color: var(--soft); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }.recommended-action-card h3 { margin: 0; color: var(--ink); font-size: 17px; }.recommended-action-card p { min-height: 40px; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }.recommended-action-card > button { width: fit-content; margin-top: auto; }.recommended-action-card > button:disabled { cursor: not-allowed; opacity: .48; }.recommended-action-card > small { color: var(--soft); font-size: 11px; }
.training-progress { display: grid; min-width: 190px; grid-template-columns: minmax(105px, 1fr) auto; align-items: center; gap: 9px; }.training-progress.compact { min-width: 145px; }.training-progress-track { height: 8px; overflow: hidden; border-radius: 99px; background: #e4eae8; }.training-progress-track span { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .25s ease; }.training-progress > strong { min-width: 34px; color: var(--ink); font-size: 12px; text-align: right; }.training-module-progress-card { margin-top: 16px; }.training-module-progress-card.disabled { border-color: #dfe3e1; background: #f5f6f5; }.training-progress-lock { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); color: var(--muted); background: #f0f2f1; }.training-progress-lock strong { color: var(--ink); font-size: 12px; }.training-progress-lock span { font-size: 12px; }.module-progress-list article { display: grid; min-height: 67px; grid-template-columns: minmax(280px, 1.4fr) auto minmax(220px, .8fr); align-items: center; gap: 18px; padding: 11px 16px; border-bottom: 1px solid var(--line); }.module-progress-list article:last-child { border-bottom: 0; }.module-progress-list article > div:first-child { display: grid; gap: 3px; }.module-progress-list article > div:first-child strong { color: var(--ink); font-size: 13px; }.module-progress-list article > div:first-child small { color: var(--soft); font-size: 11px; }.training-module-progress-card.disabled .module-progress-list { pointer-events: none; opacity: .42; filter: grayscale(.45); }
.participant-training-score { color: var(--ink); font-size: 13px; }.module-progress-header, .module-progress-list article { grid-template-columns: minmax(280px, 1.4fr) auto 75px minmax(220px, .8fr); }.module-progress-header { display: grid; align-items: center; gap: 18px; padding: 8px 16px; border-bottom: 1px solid var(--line-strong); color: var(--soft); background: #f8faf9; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }.module-training-score { color: var(--ink); font-size: 12px; text-align: center; }
.trainings-table { min-width: 1320px; }
@media (max-width: 820px) { .recommended-action-grid { grid-template-columns: 1fr; }.recommended-action-card > button { width: 100%; }.module-progress-header { display: none; }.module-progress-list article { grid-template-columns: 1fr auto auto; }.module-progress-list .training-progress { grid-column: 1 / -1; width: 100%; }.training-progress-lock { align-items: flex-start; flex-direction: column; } }
