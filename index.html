  function workflowState(e) { const a = latestFor(e.caseId); return a ? `Recorded: ${a.action}` : e.seatStatus; }

    let fields="";
    if(action==="Approve intervention") fields=`<label class="checkbox-row"><input type="checkbox" name="acknowledgement" required><span>I confirm that this is a reversible learning intervention decision, not a promotion, performance, compensation, or termination decision.</span></label><div class="field"><label for="rationale">Decision rationale</label><textarea id="rationale" name="rationale" required placeholder="Explain why this employee should receive a seat in this cycle."></textarea></div>`;
    if(action==="Request validation") fields=`<div class="field"><label for="owner">Validation owner</label><select id="owner" name="owner" required><option value="">Select owner</option>${["Line manager","HR data steward","Workforce development lead"].map(o=>`<option${o===(task?.owner||e.owner)?" selected":""}>${o}</option>`).join("")}</select></div><div class="field"><label for="due">Due date</label><input id="due" name="due" type="date" min="2026-07-01" value="${attr(task?.due||e.due||tomorrow)}" required></div><div class="field"><label for="rationale">What must be validated?</label><textarea id="rationale" name="rationale" required placeholder="Name the evidence, identity, or role-mapping check."></textarea></div>`;
    if(action==="Defer") fields=`<div class="field"><label for="rationale">Reason for deferral</label><textarea id="rationale" name="rationale" required placeholder="Explain why this cycle is not the right next step."></textarea></div><div class="field"><label for="revisit">Revisit date or condition</label><input id="revisit" name="revisit" required placeholder="e.g. next quarterly cycle after evidence review"></div>`;
    return `<div class="dialog-shell"><header class="dialog-header"><div><h2 id="action-title">${esc(action)}</h2><p>${esc(e.name)} · ${esc(e.employeeId)}</p></div><button class="close-button" type="button" data-close-action aria-label="Close action form">×</button></header><div class="dialog-body"><p class="notice">This records a prototype-session workflow event. It does not change the system recommendation or write to any HR source system.</p><form id="decision-form" class="dialog-form" data-case="${attr(e.caseId)}" data-decision="${attr(action)}"><div id="form-errors" class="form-error" role="alert"></div>${fields}<div class="dialog-actions"><div class="button-group"><button class="button primary" type="submit">Record ${esc(action.toLowerCase())}</button><button class="button" type="button" data-close-action>Cancel</button></div></div></form></div></div>`;
  }
  function openAction(caseId, action) { const e=employeeByCase.get(caseId); if(!e)return; actionContent.innerHTML=actionForm(e,action); actionDialog.showModal(); actionDialog.querySelector("textarea,input,select")?.focus(); }
  function closeAction() { if(actionDialog.open) actionDialog.close(); }
  function recordDecision(form) {
    if(!form.checkValidity()){form.reportValidity();return;}
    const fd=new FormData(form), caseId=form.dataset.case, action=form.dataset.decision, e=employeeByCase.get(caseId), prior=workflowState(e);
    const detail = [fd.get("rationale"), fd.get("revisit") ? `Revisit: ${fd.get("revisit")}` : "", fd.get("owner") ? `Owner: ${fd.get("owner")}` : "", fd.get("due") ? `Due: ${fd.get("due")}` : ""].filter(Boolean).join(" · ");
    const next=action==="Approve intervention"?"Allocated in session":action==="Request validation"?"Validation requested in session":"Deferred in session";
    state.audit.push({kind:"decision",caseId,action,actor:"Ayu Sari (demo HRBP)",timestamp:new Date().toISOString(),rationale:detail,priorState:prior,newState:next,snapshot:e.snapshotId}); saveAudit(); closeAction();
    announce(`${action} recorded for ${e.name} in this prototype session.`); profileContent.innerHTML=profileHtml(e); renderCurrent(false);
    if(profileDialog.open) profileContent.innerHTML=profileHtml(e);
  }

  function renderReskilling() {
    const shortlist=D.employees.filter(e=>e.seatStatus==="Shortlisted").sort((a,b)=>(a.initialRank||999)-(b.initialRank||999));
    const reserve=D.employees.filter(e=>e.seatStatus==="Seat held").sort((a,b)=>(a.reserveRank||999)-(b.reserveRank||999));
    const approved=sessionApprovals(); const planned=[...shortlist,...reserve];
    const pathways={}; planned.forEach(e=>pathways[e.target]=(pathways[e.target]||0)+1);
    app.innerHTML=`${pageHeader("Reskilling", "Plan the next learning cycle without confusing a recommendation, review task, human decision, or seat allocation.")}${pilotBanner()}
      <section class="section capacity-grid"><div class="capacity-card"><span class="field-label">Total planning capacity</span><div class="metric">30</div><p>Assumption to validate with L&D operations and the budget owner.</p></div><div class="capacity-card"><span class="field-label">Immediate shortlist</span><div class="metric">24</div><p>Decision-ready candidates within the initial ranking cutoff.</p></div><div class="capacity-card"><span class="field-label">Validation reserve</span><div class="metric">6</div><p>Held for resolvable evidence checks; not approved yet.</p></div></section>
      <div class="capacity-bar" aria-label="Thirty planning seats: twenty-four immediate and six reserve"><span></span><span></span></div><p class="cell-meta">${approved} human approval action${approved===1?"":"s"} recorded in this browser session; ${Math.max(0,24-approved)} immediate seats remain unrecorded. System recommendations are unchanged.</p>
      <section class="section two-column"><div class="panel"><div class="section-heading"><div><h2>Seat plan</h2><p>24 immediate candidates followed by 6 reserve cases.</p></div></div><div class="table-shell"><table><caption>Current 30-seat planning cohort</caption><thead><tr><th>Employee</th><th>Role</th><th>Evidence</th><th>Readiness</th><th>Planning state</th><th>Action</th></tr></thead><tbody>${planned.map(e=>`<tr><td><strong>${esc(e.name)}</strong><span class="cell-meta">${esc(e.employeeId)}</span></td><td>${esc(e.role)}</td><td>${pct(e.evidenceCoverage)}</td><td>${score(e.readiness)}</td><td>${badge(e.seatStatus)}</td><td><button class="button small" data-open="${attr(e.caseId)}">Review</button></td></tr>`).join("")}</tbody></table></div><div class="employee-cards">${planned.map(employeeCard).join("")}</div></div>
      <aside class="panel"><h2>Pathway mix</h2><ul class="compact-list">${Object.entries(pathways).map(([k,v])=>`<li><div class="item-row"><span>${esc(k)}</span><strong>${v}/30</strong></div></li>`).join("")}</ul><h3>At the validation cutoff</h3><ol><li>Re-evaluate resolved reserve cases.</li><li>Fill up to 6 held seats.</li><li>Release unused seats to the original eligible waitlist.</li><li>Never exceed 30 approvals.</li></ol><p class="notice warning">Reserve status is not approval. Unresolved cases are deferred for timing or validation reasons, never interpreted as low readiness.</p></aside></section>`;
  }

  function renderReviews() {
    let tasks=D.reviewTasks.filter(t=>(!state.owner||t.owner===state.owner)&&(!state.taskStatus||taskStatus(t)===state.taskStatus));
    const owners=[...new Set(D.reviewTasks.map(t=>t.owner))].sort();
    app.innerHTML=`${pageHeader("Review Tasks", "Resolve named identity, evidence, and role-mapping checks before an HR manager approves an intervention.")}
      <section class="toolbar" aria-label="Review task filters"><div class="field"><label for="owner-filter">Owner</label><select id="owner-filter" data-task-control="owner">${optionList(owners,state.owner,"All owners")}</select></div><div class="field"><label for="task-status-filter">Status</label><select id="task-status-filter" data-task-control="taskStatus">${optionList(["Assigned","In progress","Resolved"],state.taskStatus,"All statuses")}</select></div></section>
      <div class="results-bar"><strong>${tasks.length} of ${D.reviewTasks.length} review tasks</strong><span>Every Needs validation employee has an owned task.</span></div>
      ${tasks.length?`<section class="task-grid">${tasks.map(t=>{const e=employeeByCase.get(t.caseId),status=taskStatus(t);return `<article class="task-card"><div><h3>${esc(t.type)} · ${esc(e.name)}</h3><p>${esc(t.reasonLabel)} · ${esc(e.employeeId)}</p></div><div><span class="field-label">Owner</span><p>${esc(t.owner)}</p></div><div class="task-due"><span class="field-label">Due</span><p>${dateLabel(t.due)} · ${badge(status)}</p></div><div class="button-group"><button class="button small" data-open="${attr(t.caseId)}">Open employee</button>${status!=="Resolved"?`<button class="button small secondary" data-resolve="${attr(t.caseId)}">Record resolved</button>`:""}</div></article>`;}).join("")}</section>`:`<div class="panel empty-state"><h2>No review tasks match this view</h2><p>Change the owner or status filter. This does not mean the cohort has no data issues.</p><button class="button secondary" data-clear-tasks>Clear filters</button></div>`}`;
  }
  function resolveTask(caseId) {
    const task=taskByCase.get(caseId), e=employeeByCase.get(caseId); if(!task||taskResolution(caseId))return;
    state.audit.push({kind:"task-resolution",caseId,action:"Review task resolved",actor:"Ayu Sari (demo HRBP)",timestamp:new Date().toISOString(),rationale:`Prototype resolution recorded for ${task.type}; a new decision snapshot would be required before approval.`,priorState:task.status,newState:"Resolved",snapshot:e.snapshotId}); saveAudit(); announce(`Review task recorded as resolved for ${e.name}.`); renderCurrent(false);
  }

  function transitionMatrix() {
    const actions=["Approve intervention","Request validation","Defer"], m={}; actions.forEach(s=>{m[s]={};actions.forEach(c=>m[s][c]=0);});
    D.comparisons.forEach(c=>{if(m[c.sourceAction]&&m[c.sourceAction][c.contextAction]!=null)m[c.sourceAction][c.contextAction]++;}); return {actions,m};
  }
  function renderDataQuality() {
    const avgContext=D.employees.reduce((s,e)=>s+e.evidenceCoverage,0)/D.employees.length;
    const avgSource=D.comparisons.reduce((s,c)=>s+c.sourceCoverage,0)/D.comparisons.length;
    const calculable=D.employees.filter(e=>e.readiness!=null).length;
    const identity=D.reviewTasks.filter(t=>t.type==="Identity review").length;
    const excluded=D.employees.reduce((s,e)=>s+e.excluded.length,0);
    const tm=transitionMatrix(), changed=D.comparisons.filter(c=>c.sourceAction!==c.contextAction);
    app.innerHTML=`${pageHeader("Data Quality", "See where governed context changes what is knowable—and where uncertainty still requires a person.")}
      <section class="summary-grid"><div class="summary-card"><span class="eyebrow">Contextualized coverage</span><span class="metric">${pct(avgContext)}</span><span class="definition">Average usable evidence coverage across the same 200 employee-pathway cases.</span></div><div class="summary-card"><span class="eyebrow">Readiness calculable</span><span class="metric">${calculable}/200</span><span class="definition">Coverage-gated results; the other ${200-calculable} are explicitly Not calculated.</span></div><div class="summary-card"><span class="eyebrow">Open identity tasks</span><span class="metric">${identity}</span><span class="definition">Identity conflicts become owned reviews, not weak employee evidence.</span></div><div class="summary-card"><span class="eyebrow">Excluded evidence</span><span class="metric">${excluded}</span><span class="definition">Stale, disputed, unknown-scale, or otherwise unusable events kept out of decisions.</span></div></section>
      <section class="section two-column"><div class="panel"><h2>Same-grain decision-state transitions</h2><p>All 200 cases use the same employee, pathway, cycle, evaluator, thresholds, capacity and output schema. Only permitted evidence changes.</p><div class="table-shell matrix-table"><table><caption>Source-only to contextualized recommendation transition matrix for 200 cases</caption><thead><tr><th>Source-only \ Contextualized</th>${tm.actions.map(a=>`<th>${esc(a)}</th>`).join("")}</tr></thead><tbody>${tm.actions.map(s=>`<tr><th scope="row">${esc(s)}</th>${tm.actions.map(c=>`<td class="numeric">${tm.m[s][c]}</td>`).join("")}</tr>`).join("")}</tbody></table></div><p class="notice"><strong>${changed.length}/200 cases change decision state.</strong> This is a workflow transition, not an accuracy claim: synthetic outcome truth is unavailable.</p></div>
      <aside class="panel"><h2>What contextualization adds</h2><dl class="definition-grid"><div><dt>Source-only average coverage</dt><dd>${pct(avgSource)}</dd></div><div><dt>Contextualized average coverage</dt><dd>${pct(avgContext)}</dd></div></dl><ul><li>Accepted identity links across governed sources</li><li>Normalized role and skill taxonomy mappings</li><li>Observed, inferred, and manager-confirmed evidence kept distinct</li><li>Provenance, exclusions, confidence dimensions, and owned review tasks</li></ul><p class="notice warning">More context does not always increase confidence. It can reveal a conflict and correctly introduce review.</p></aside></section>
      <section class="section"><div class="section-heading"><div><h2>Inspect a changed case</h2><p>Point to what became knowable, not only the changed number.</p></div></div><div class="task-grid">${changed.slice(0,6).map(c=>{const e=employeeByCase.get(c.caseId);return `<article class="task-card"><div><h3>${esc(e.name)} · ${esc(e.role)}</h3><p>${esc(c.sourceAction)} → ${esc(c.contextAction)}</p></div><div><span class="field-label">Evidence coverage</span><p>${pct(c.sourceCoverage)} → ${pct(c.contextCoverage)}</p></div><div class="task-due"><span class="field-label">Context added</span><p>${esc(c.contextAdded.slice(0,2).join(", "))}</p></div><button class="button small secondary" data-open="${attr(c.caseId)}">Compare</button></article>`;}).join("")}</div></section>`;
  }

  function syncNavigation() {
    document.querySelectorAll(".primary-nav a").forEach(a => { if(a.dataset.view===state.view)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current"); });
  }
  function renderCurrent(focusMain=true) {
    if(state.view==="overview")renderOverview(); else if(state.view==="employees")renderEmployees(); else if(state.view==="reskilling")renderReskilling(); else if(state.view==="reviews")renderReviews(); else renderDataQuality();
    syncNavigation(); if(focusMain) app.focus();
  }
  function applyRoute() {
    const r=route(); state.view=r.view;
    if(r.params.get("quality")){state.quality=r.params.get("quality");state.page=1;}
    if(r.params.get("action")){state.action=r.params.get("action");state.page=1;}
    if(r.params.get("owner")){state.owner=r.params.get("owner");}
    if(r.params.get("status")){state.taskStatus=r.params.get("status");}
    renderCurrent(); const caseId=r.params.get("employee"); if(caseId)openProfile(caseId);
  }
  function clearEmployeeFilters(){["search","branch","department","role","pathway","quality","action","review","seat"].forEach(k=>state[k]="");state.page=1;renderEmployees();announce("Employee filters cleared. Showing all 200 employees.");}

  document.addEventListener("click", e => {
    const go=e.target.closest("[data-go]"); if(go){const params={};const raw=go.dataset.filter||"";if(raw){const [k,...v]=raw.split("=");params[k]=v.join("=");}navigate(go.dataset.go,params);return;}
    const open=e.target.closest("[data-open]"); if(open){openProfile(open.dataset.open,open);return;}
    if(e.target.closest("[data-close-profile]")){closeProfile();return;}
    if(e.target.closest("[data-close-action]")){closeAction();return;}
    const act=e.target.closest("[data-action]"); if(act&&!act.disabled){openAction(act.dataset.case,act.dataset.action);return;}
    const sort=e.target.closest("[data-sort]"); if(sort){const k=sort.dataset.sort;if(state.sortKey===k)state.sortDir=state.sortDir==="asc"?"desc":"asc";else{state.sortKey=k;state.sortDir="asc";}renderEmployees();return;}
    const page=e.target.closest("[data-page]"); if(page&&!page.disabled){state.page=Number(page.dataset.page);renderEmployees();app.querySelector(".results-bar")?.scrollIntoView();return;}
    if(e.target.closest("[data-clear-filters]")){clearEmployeeFilters();return;}
    if(e.target.closest("[data-clear-tasks]")){state.owner="";state.taskStatus="";renderReviews();return;}
    const resolve=e.target.closest("[data-resolve]"); if(resolve){resolveTask(resolve.dataset.resolve);return;}
  });
  document.addEventListener("input", e => {if(e.target.matches("[data-control=search]")){state.search=e.target.value;state.page=1;renderEmployees();document.getElementById("employee-search")?.focus();}});
  document.addEventListener("change", e => {
    const c=e.target.dataset.control;if(c&&c!=="search"){if(c==="sort"){state.sortKey=e.target.value;state.sortDir="asc";}else state[c]=e.target.value;state.page=1;renderEmployees();announce(`${e.target.labels?.[0]?.textContent||"Filter"} updated. ${applyFilters([...D.employees]).length} employees shown.`);}
    const tc=e.target.dataset.taskControl;if(tc){state[tc]=e.target.value;renderReviews();}
  });
  document.addEventListener("submit", e=>{if(e.target.id==="decision-form"){e.preventDefault();recordDecision(e.target);}});
  profileDialog.addEventListener("close",()=>{state.selectedCase=null;writeSelectedEmployee(null);});
  window.addEventListener("hashchange",applyRoute);
  applyRoute();
})();

</script>
</body>
</html>
