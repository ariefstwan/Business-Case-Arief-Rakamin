<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medika Learning Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --rausch: #ff385c;
            --rausch-active: #e00b41;
            --rausch-soft: #fff1f3;
            --ink: #222222;
            --body: #3f3f3f;
            --muted: #6a6a6a;
            --muted-soft: #929292;
            --hairline: #dddddd;
            --hairline-soft: #ebebeb;
            --surface-soft: #f7f7f7;
            --surface-strong: #f2f2f2;
            --canvas: #ffffff;
            --shadow-float: rgba(0,0,0,.02) 0 0 0 1px, rgba(0,0,0,.04) 0 2px 6px, rgba(0,0,0,.1) 0 4px 8px;
        }

        * { box-sizing: border-box; }
        html { background: var(--canvas); }
        body {
            margin: 0;
            color: var(--ink);
            background: var(--canvas);
            font-family: "Airbnb Cereal VF", Circular, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        button, input, textarea { font: inherit; }
        button { transition: color .2s ease, background-color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .2s ease; }
        button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

        @keyframes airbnbRise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-in { animation: airbnbRise .5s cubic-bezier(.22,1,.36,1) both; }

        /* Airbnb color-token migration for the existing utility markup. */
        .text-slate-800, .text-slate-700 { color: var(--ink) !important; }
        .text-slate-600 { color: var(--body) !important; }
        .text-slate-500, .text-slate-400 { color: var(--muted) !important; }
        .text-slate-300 { color: var(--muted-soft) !important; }
        .bg-slate-50, .bg-slate-100 { background-color: var(--surface-soft) !important; }
        .bg-slate-300 { background-color: var(--hairline) !important; }
        .border-slate-100, .border-slate-200 { border-color: var(--hairline-soft) !important; }
        .border-slate-300 { border-color: var(--hairline) !important; }
        .bg-indigo-600, .bg-indigo-500 { background-color: var(--rausch) !important; }
        .bg-indigo-700 { background-color: var(--rausch-active) !important; }
        .bg-indigo-50, .bg-indigo-100 { background-color: var(--rausch-soft) !important; }
        .text-indigo-800, .text-indigo-700, .text-indigo-600, .text-indigo-500 { color: var(--rausch) !important; }
        .border-indigo-600 { border-color: var(--rausch) !important; }
        .hover\:bg-indigo-700:hover { background-color: var(--rausch-active) !important; }
        .hover\:bg-indigo-50:hover, .hover\:bg-slate-100:hover, .hover\:bg-slate-50:hover { background-color: var(--surface-soft) !important; }
        .hover\:text-indigo-600:hover, .hover\:text-indigo-700:hover, .hover\:text-indigo-800:hover, .group:hover .group-hover\:text-indigo-700 { color: var(--rausch-active) !important; }
        .hover\:text-slate-600:hover, .hover\:text-slate-700:hover, .hover\:text-slate-800:hover { color: var(--ink) !important; }
        .hover\:border-slate-300:hover { border-color: var(--hairline) !important; }
        .hover\:border-indigo-400:hover, .group:hover .group-hover\:border-indigo-400 { border-color: var(--rausch) !important; }
        .focus\:ring-indigo-500:focus { --tw-ring-color: var(--ink) !important; }
        .rounded-xl { border-radius: 14px !important; }
        .rounded-lg { border-radius: 8px !important; }
        .shadow-sm, .shadow-md, .shadow-xl, .shadow-2xl { box-shadow: var(--shadow-float) !important; }

        .learning-app { min-height: 100vh; background: var(--canvas) !important; }
        .app-header { border-color: var(--hairline) !important; background: rgba(255,255,255,.96) !important; box-shadow: none !important; backdrop-filter: blur(14px); }
        .app-header-inner { width: 100%; max-width: 1280px !important; height: 80px !important; padding-inline: 32px !important; }
        .app-brand { color: var(--rausch) !important; font-size: 18px; font-weight: 600 !important; letter-spacing: -.2px; }
        .app-brand-mark { width: 40px !important; height: 40px !important; border-radius: 9999px !important; background: var(--rausch) !important; font-size: 18px !important; font-weight: 600 !important; }
        .account-control { min-height: 48px; padding: 6px 10px 6px 8px !important; border: 1px solid var(--hairline) !important; border-radius: 9999px; box-shadow: 0 2px 4px rgba(0,0,0,.06); }
        .account-avatar { display: block; overflow: hidden; border: 1px solid var(--hairline-soft); color: var(--ink) !important; background: var(--surface-strong) !important; object-fit: cover; object-position: center 28%; }

        .dashboard-layout { display: block !important; max-width: 1080px !important; padding: 48px 32px 80px !important; }
        .dashboard-heading-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
        .dashboard-heading-row h1 { margin-bottom: 0 !important; }
        .dashboard-reset { min-height: 40px; padding: 8px 14px; border: 0; border-radius: 8px; color: var(--muted); background: transparent; font-size: 14px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
        .dashboard-reset:hover { color: var(--ink); background: var(--surface-soft); }
        .dashboard-body-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 32px; }
        .dashboard-body-card { display: grid; grid-template-rows: auto auto 1fr auto; gap: 12px; min-height: 250px; padding: 24px; border: 1px solid var(--hairline); border-radius: 14px; background: var(--canvas); transition: box-shadow .2s ease, transform .2s ease; }
        .dashboard-body-card:hover { box-shadow: var(--shadow-float); transform: translateY(-2px); }
        .dashboard-body-icon { display: grid; width: 44px; height: 44px; place-items: center; border-radius: 9999px; color: var(--rausch); background: var(--rausch-soft); }
        .dashboard-body-card h2 { margin: 0; color: var(--ink); font-size: 20px; font-weight: 600; line-height: 1.25; letter-spacing: -.18px; }
        .dashboard-body-card p { margin: 0; color: var(--body); font-size: 14px; line-height: 1.5; }
        .dashboard-body-card strong { color: var(--ink); font-size: 14px; font-weight: 600; }
        .dashboard-card-action { display: inline-flex; width: fit-content; min-height: 40px; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid var(--ink); border-radius: 8px; color: var(--ink); background: var(--canvas); font-size: 14px; font-weight: 500; }
        .dashboard-card-action:hover { background: var(--surface-soft); }
        .dashboard-main h1 { margin: 0 0 24px; color: var(--ink) !important; font-size: 28px !important; font-weight: 600 !important; line-height: 1.25; letter-spacing: -.4px; }

        .assigned-training-card:hover { box-shadow: var(--shadow-float) !important; }
        .assigned-training-accent { display: none; }
        .training-current-badge { padding: 5px 11px !important; border-radius: 9999px !important; color: var(--ink) !important; background: var(--surface-strong) !important; font-size: 11px !important; font-weight: 600 !important; letter-spacing: 0 !important; }
        .assigned-training-card h2 { color: var(--ink) !important; font-size: 22px !important; font-weight: 500 !important; line-height: 1.25; letter-spacing: -.3px; }
        .training-stats { padding: 24px !important; border-color: var(--hairline-soft) !important; border-radius: 14px !important; background: var(--surface-soft) !important; }

        button.bg-indigo-600 { min-height: 48px; padding: 13px 24px !important; border-radius: 8px !important; color: white !important; background: var(--rausch) !important; box-shadow: none !important; font-size: 16px !important; font-weight: 500 !important; }
        button.bg-indigo-600:hover { background: var(--rausch-active) !important; }
        button.bg-white.border { min-height: 48px; padding: 12px 23px !important; border-color: var(--ink) !important; border-radius: 8px !important; color: var(--ink) !important; background: var(--canvas) !important; box-shadow: none !important; font-size: 16px; font-weight: 500 !important; }

        .training-workspace { background: var(--canvas) !important; }
        .training-banner { border-color: var(--hairline) !important; background: var(--canvas) !important; }
        .training-banner-inner { max-width: 1080px !important; padding: 32px !important; }
        .back-link { color: var(--ink) !important; text-decoration: underline; text-underline-offset: 3px; }
        .back-link:hover { color: var(--rausch-active) !important; }
        .training-status-badge { padding: 6px 12px !important; border-radius: 9999px !important; font-size: 11px !important; font-weight: 600 !important; letter-spacing: 0 !important; }
        .training-title { color: var(--ink) !important; font-size: 28px !important; font-weight: 600 !important; line-height: 1.25; letter-spacing: -.4px; }
        .progress-display { color: var(--ink) !important; font-size: 40px !important; font-weight: 600 !important; line-height: 1; letter-spacing: -1px; }
        .training-tabs { max-width: 1080px !important; gap: 8px; }
        .training-tabs button { padding: 16px 20px !important; color: var(--muted) !important; font-size: 14px; font-weight: 500 !important; }
        .training-tabs button.border-indigo-600 { color: var(--ink) !important; border-color: var(--ink) !important; }
        .training-tabs button:hover { color: var(--ink) !important; background: var(--surface-soft); }
        .training-content { max-width: 1080px !important; padding: 48px 32px 96px !important; }
        .training-content h3 { color: var(--ink) !important; font-size: 20px !important; font-weight: 600 !important; line-height: 1.25; letter-spacing: -.18px; }
        .training-content p, .training-content li { color: var(--body) !important; font-size: 16px; line-height: 1.6; }
        .training-info-card { padding: 24px !important; border-color: var(--hairline) !important; border-radius: 14px !important; box-shadow: none !important; }
        .training-info-card h4, .learning-section-title { color: var(--ink) !important; font-size: 16px !important; font-weight: 600 !important; letter-spacing: 0 !important; text-transform: none !important; }
        .certificate-card { display: flex; align-items: center; gap: 18px; padding: 24px; border: 1px solid var(--hairline); border-radius: 14px; background: white; }
        .certificate-card.is-locked { background: var(--surface-soft); }
        .certificate-icon { display: grid; width: 52px; height: 52px; flex: none; place-items: center; border-radius: 14px; color: var(--rausch); background: var(--rausch-soft); }
        .certificate-card.is-locked .certificate-icon { color: var(--muted); background: #ebebeb; }
        .certificate-copy { min-width: 0; flex: 1; }
        .certificate-copy h4 { margin: 0; color: var(--ink); font-size: 18px; font-weight: 600; }
        .certificate-copy p { margin: 5px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
        .certificate-download { min-height: 44px; padding: 0 18px; border: 0; border-radius: 8px; color: white; background: var(--rausch); font-size: 14px; font-weight: 600; white-space: nowrap; }
        .certificate-download:hover:not(:disabled) { background: var(--rausch-active); }
        .certificate-download:disabled { cursor: not-allowed; color: #a3a3a3; background: #dddddd; }
        .deadline-countdown-card { padding: 24px; border: 1px solid var(--hairline); border-radius: 14px; background: var(--surface-soft); }
        .deadline-countdown-label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 500; }
        .deadline-countdown-label svg { color: var(--rausch); }
        .deadline-countdown-value { display: flex; align-items: baseline; gap: 8px; margin: 14px 0 4px; }
        .deadline-countdown-value strong { color: var(--ink); font-size: 40px; font-weight: 600; line-height: 1; letter-spacing: -1px; }
        .deadline-countdown-value span { color: var(--ink); font-size: 16px; font-weight: 500; }
        .deadline-countdown-card p { margin: 0; color: var(--muted) !important; font-size: 13px !important; line-height: 1.45 !important; }
        .training-deadline-inline { display: inline-flex; min-height: 28px; box-sizing: border-box; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; border-radius: 9999px; background: #fff4f6; color: var(--rausch); font-size: 13px; font-weight: 600; line-height: 1; white-space: nowrap; }
        .training-deadline-inline svg { display: block; flex: none; }
        .module-card { padding: 24px !important; border-color: var(--hairline) !important; border-radius: 14px !important; box-shadow: none !important; }
        .module-card:hover { border-color: var(--hairline) !important; box-shadow: var(--shadow-float) !important; transform: translateY(-2px); }
        .module-card.expanded { box-shadow: var(--shadow-float) !important; transform: none; }
        .module-card h4 { color: var(--ink) !important; font-size: 18px !important; font-weight: 600 !important; }
        .module-card span[class*="text-[10px]"], .training-content span[class*="text-[10px]"] { border-radius: 9999px !important; font-size: 11px !important; font-weight: 600 !important; letter-spacing: 0 !important; }
        .inline-module-details { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--hairline-soft); cursor: default; animation: airbnbRise .38s cubic-bezier(.22,1,.36,1) both; }
        .inline-module-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 16px; }
        .inline-module-heading h5 { margin: 3px 0 0; color: var(--ink); font-size: 16px; font-weight: 600; }
        .inline-module-kicker { color: var(--muted); font-size: 12px; font-weight: 500; }
        .inline-module-progress { padding: 6px 10px; border-radius: 9999px; color: var(--rausch); background: var(--rausch-soft); font-size: 12px; font-weight: 600; white-space: nowrap; }
        .inline-module-close { min-height: 40px; padding: 8px 12px; border: 0; border-radius: 8px; color: var(--muted); background: transparent; font-size: 14px; font-weight: 500; }
        .inline-module-close:hover { color: var(--ink); background: var(--surface-soft); }
        .activity-modal-backdrop { background: rgba(0,0,0,.5) !important; backdrop-filter: blur(3px); }
        .activity-modal { border-radius: 20px !important; box-shadow: var(--shadow-float) !important; overflow: hidden; animation: airbnbRise .48s cubic-bezier(.22,1,.36,1) both; }
        .activity-row { border-color: var(--hairline-soft) !important; border-radius: 14px !important; }
        .activity-row:hover { border-color: var(--hairline) !important; box-shadow: var(--shadow-float); }
        .activity-score { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; padding: 4px 8px; border-radius: 9999px; background: var(--surface-soft); color: var(--muted); font-size: 11px; font-weight: 600; line-height: 1; }
        .activity-score.is-earned { background: #eaf7ee; color: #18794e; }
        .activity-score-note { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 16px; padding: 14px 16px; border: 1px solid var(--hairline); border-radius: 12px; background: var(--surface-soft); }
        .activity-score-note strong { color: var(--ink); font-size: 14px; }
        .activity-score-note span { color: var(--muted); font-size: 13px; }
        .activity-modal textarea { min-height: 144px; border-color: var(--hairline) !important; border-radius: 8px !important; }
        .activity-modal textarea:focus { border-color: var(--ink) !important; outline: 1px solid var(--ink) !important; box-shadow: none !important; }
        .video-play-button { display: grid; width: 72px; height: 72px; place-items: center; border: 1px solid rgba(255,255,255,.42); border-radius: 9999px; color: white; background: rgba(255,255,255,.18); backdrop-filter: blur(8px); cursor: pointer; }
        .video-play-button:hover { background: rgba(255,255,255,.28); transform: scale(1.04); }
        .video-play-button:disabled { cursor: default; opacity: .72; transform: none; }
        .activity-modal button.bg-indigo-600:disabled { cursor: wait; opacity: .7; }
        .video-playback-status { position: absolute; right: 16px; bottom: 16px; left: 16px; display: grid; gap: 8px; color: white; font-size: 13px; }
        .video-playback-progress { height: 4px; overflow: hidden; border-radius: 9999px; background: rgba(255,255,255,.25); }
        .video-playback-progress::after { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--rausch); animation: simulatedVideoProgress 2s linear forwards; content: ""; }
        @keyframes simulatedVideoProgress { to { width: 100%; } }
        .toast-notice { right: 32px !important; bottom: 32px !important; padding: 14px 20px !important; border-radius: 9999px !important; background: var(--ink) !important; box-shadow: var(--shadow-float) !important; }

        @media (max-width: 743px) {
            .app-header-inner { height: 72px !important; padding-inline: 20px !important; }
            .app-brand span { display: none; }
            .dashboard-layout { padding: 32px 20px 64px !important; }
            .dashboard-heading-row { align-items: flex-start; flex-direction: column; }
            .dashboard-body-grid { grid-template-columns: 1fr; }
            .dashboard-body-card { min-height: 0; }
            .assigned-training-card { padding: 24px !important; }
            .training-banner-inner, .training-content { padding-inline: 20px !important; }
            .training-tabs { padding-inline: 12px !important; }
            .training-title { font-size: 24px !important; }
            .inline-module-heading { align-items: stretch; flex-direction: column; }
            .certificate-card { align-items: flex-start; flex-wrap: wrap; }
            .certificate-download { width: 100%; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
    </style>
</head>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- SAFE ICONS (Using <g> to prevent React Fragment crashes) ---
        const Icon = ({ name, size = 20, className = "" }) => {

        // --- MAIN APP ---
        const App = () => {
            // PAGE ROUTING STATE ('dashboard' vs 'training-page')
            const [page, setPage] = useState('dashboard');
            const [trainTab, setTrainTab] = useState('overview'); // For training page tabs
            
            const [error, setError] = useState(false);
            const [toast, setToast] = useState(null);
            
            const [activeModule, setActiveModule] = useState(null);
            const [activeActivity, setActiveActivity] = useState(null);
            const [videoPlaying, setVideoPlaying] = useState(false);
            const [activityStarted, setActivityStarted] = useState(false);
            const [draftText, setDraftText] = useState("");

            // Params Verification
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const pEmployee = params.get('employee');
                const pTraining = params.get('training');
                if ((pEmployee && pEmployee !== DEFAULT_EMPLOYEE.id) || (pTraining && pTraining !== DEFAULT_TRAINING.id)) {
                    setError(true);
                }
            }, []);

            // Progress State
            const progressKey = `medika_prog_${DEFAULT_EMPLOYEE.id}_${DEFAULT_TRAINING.id}`;
            const draftKey = `medika_draft_${DEFAULT_EMPLOYEE.id}`;
            const [progress, setProgress] = useState(() => {
                const saved = localStorage.getItem(progressKey);
                return saved ? JSON.parse(saved) : { a1: true }; // a1 is 35% completed by default
            });

            // Helpers
            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            };

            const markComplete = (actId, message = "Activity marked as complete!") => {
                const next = { ...progress, [actId]: true };
                setProgress(next);
                localStorage.setItem(progressKey, JSON.stringify(next));
                showToast(message);
                setActiveActivity(null); 
            };

            useEffect(() => {
                setVideoPlaying(false);
                setActivityStarted(false);
            }, [activeActivity?.id]);

            useEffect(() => {
                if (!videoPlaying || activeActivity?.type !== 'Video') return;
                const activityId = activeActivity.id;
                const timer = window.setTimeout(() => {
                    setVideoPlaying(false);
                    markComplete(activityId, "Video completed automatically.");
                }, 2000);
                return () => window.clearTimeout(timer);
            }, [videoPlaying, activeActivity?.id]);

            const resetProgress = () => {
                const resetState = { a1: true };
                setProgress(resetState);
                localStorage.setItem(progressKey, JSON.stringify(resetState));
                localStorage.removeItem(draftKey);
                showToast("Demo progress reset to default.");
            };

            const calcModProgress = (modId) => {
                const mod = MODULES.find(m => m.id === modId);
                return mod.activities.reduce((acc, act) => acc + (progress[act.id] ? act.weight : 0), 0);
            };

            const totalActivities = MODULES.reduce((acc, m) => acc + m.activities.length, 0);
            const completedCount = Object.keys(progress).length;
            const overallProgress = Math.min(100, Math.round((completedCount / totalActivities) * 100));
            const trainingDeadline = new Date("2026-10-31T23:59:59+07:00").getTime();
            const daysUntilDeadline = Math.max(0, Math.ceil((trainingDeadline - Date.now()) / 86400000));
            const deadlineUnit = daysUntilDeadline === 1 ? "day left" : "days left";

            const getNextActivity = () => {
                for (let m of MODULES) {
                    for (let a of m.activities) {
                        if (!progress[a.id]) return { module: m, activity: a };
                    }
                }
                return null;
            };

            const navigateToTraining = (targetTab = 'overview', specificModule = null) => {
                setPage('training-page');
                setTrainTab(targetTab);
                if (specificModule) setActiveModule(specificModule);
            };

            // Error View
            if (error) {
                return (
                    <div className="flex h-screen items-center justify-center bg-slate-50">
                        <div className="bg-white p-8 rounded-xl shadow border border-slate-200 text-center max-w-md">
                            <Icon name="help" size={48} className="mx-auto text-slate-400 mb-4" />
                            <h2 className="text-xl font-bold text-slate-800 mb-2">Record Not Found</h2>
                            <p className="text-slate-600 mb-6">The specified employee or training ID does not match our records.</p>
                            <button onClick={() => window.location.href = window.location.pathname} className="bg-indigo-600 text-white px-5 py-2.5 rounded-lg font-medium">Load Default Demo</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="learning-app min-h-screen flex flex-col no-print bg-slate-50">
                    {/* GLOBAL HEADER */}
                    <header className="app-header bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
                        <div className="app-header-inner max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="app-brand flex items-center gap-3 text-indigo-700 font-bold text-lg cursor-pointer" onClick={() => setPage('dashboard')}>
                                <div className="app-brand-mark w-8 h-8 bg-indigo-600 rounded flex items-center justify-center text-white text-xl">M</div>
                                <span>Medika Learning</span>
                            </div>
                            <div className="flex items-center gap-6">
                                <div className="relative cursor-pointer">
                                    <Icon name="bell" className="text-slate-500 hover:text-slate-800" />
                                    <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">1</span>
                                </div>
                                <div className="account-control flex items-center gap-3 border-l border-slate-200 pl-6 cursor-pointer">
                                    <img className="account-avatar w-9 h-9 rounded-full" src="./assets/bima-puspita-avatar.png" alt="Bima Puspita" />
                                    <div className="hidden md:block text-sm">
                                        <div className="font-semibold text-slate-800 leading-tight">{DEFAULT_EMPLOYEE.name}</div>
                                        <div className="text-slate-500 text-xs">{DEFAULT_EMPLOYEE.role}</div>
                                    </div>
                                    <Icon name="chevron" className="text-slate-400 w-4 h-4 rotate-90" />
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* ROUTING LOGIC: DASHBOARD vs NEW TRAINING PAGE */}
                    {page === 'dashboard' ? (
                        <div className="dashboard-layout flex-1 max-w-7xl mx-auto w-full px-4 py-8 animate-slide-in">
                            <main className="dashboard-main min-w-0">
                                <div className="dashboard-heading-row">
                                    <h1 className="text-2xl font-bold text-slate-800">Welcome back, {DEFAULT_EMPLOYEE.name.split(' ')[0]}</h1>
                                    <button className="dashboard-reset" type="button" onClick={resetProgress}>Reset demo progress</button>
                                </div>

                                <section className="assigned-training-card bg-white p-6 rounded-xl border border-slate-200 shadow-sm relative overflow-hidden" aria-labelledby="current-training-title">
                                    <div className="assigned-training-accent absolute top-0 left-0 w-1.5 h-full bg-indigo-500"></div>
                                    <div className="flex flex-col md:flex-row justify-between gap-6">
                                        <div className="flex-1">
                                            <div className="flex items-center gap-2 mb-3">
                                                <span className="training-current-badge bg-indigo-100 text-indigo-700 text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider">Current Assigned Training</span>
                                            </div>
                                            <h2 id="current-training-title" className="text-xl font-bold text-slate-800 mb-2">{DEFAULT_TRAINING.title}</h2>
                                            <div className="mb-2 flex justify-between text-sm mt-6">
                                                <span className="font-medium text-slate-700">Program Progress</span>
                                                <span className="font-bold text-indigo-700">{overallProgress}%</span>
                                            </div>
                                            <div className="w-full bg-slate-100 rounded-full h-2 mb-6">
                                                <div className="bg-indigo-600 h-2 rounded-full transition-all duration-500" style={{width: `${overallProgress}%`}}></div>
                                            </div>
                                            <div className="flex flex-wrap gap-3">
                                                <button onClick={() => {
                                                    const next = getNextActivity();
                                                    navigateToTraining('learning-path', next ? next.module : null);
                                                }} className="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg font-medium text-sm transition-colors shadow-sm">Continue Learning</button>
                                                <button onClick={() => navigateToTraining('overview')} className="bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 px-5 py-2.5 rounded-lg font-medium text-sm transition-colors">View Details</button>
                                            </div>
                                        </div>
                                        <div className="training-stats w-full md:w-64 bg-slate-50 p-5 rounded-lg flex flex-col justify-center border border-slate-100 shrink-0">
                                            <ul className="space-y-3 text-sm">
                                                <li className="flex justify-between"><span className="text-slate-600">Total Modules</span> <span className="font-bold text-slate-800">{MODULES.length}</span></li>
                                                <li className="flex justify-between"><span className="text-slate-600">Activities Done</span> <span className="font-bold text-slate-800">{completedCount} / {totalActivities}</span></li>
                                                <li className="flex justify-between pt-3 border-t border-slate-200"><span className="text-slate-600">Deadline</span> <span className="font-bold text-amber-600">31 Oct</span></li>
                                            </ul>
                                        </div>
                                    </div>
                                </section>

                                <section className="dashboard-body-grid" aria-label="Learning support and progress">
                                    <article className="dashboard-body-card">
                                        <span className="dashboard-body-icon" aria-hidden="true"><Icon name="calendar" size={22}/></span>
                                        <h2>Training timeline</h2>
                                        <div><strong>Next deadline · 14 October</strong><p>Process Automation Practice is due before the final program deadline on 31 October.</p></div>
                                        <button className="dashboard-card-action" type="button" onClick={() => navigateToTraining('overview')}>View training <Icon name="chevron" size={16}/></button>
                                    </article>
                                    <article className="dashboard-body-card">
                                        <span className="dashboard-body-icon" aria-hidden="true"><Icon name="award" size={22}/></span>
                                        <h2>Certificate</h2>
                                        <div><strong>{completedCount} of {totalActivities} activities completed</strong><p>Your certificate will become available after every required activity is complete.</p></div>
                                        <button className="dashboard-card-action" type="button" onClick={() => navigateToTraining('certificate')}>View certificate <Icon name="chevron" size={16}/></button>
                                    </article>
                                    <article className="dashboard-body-card">
                                        <span className="dashboard-body-icon" aria-hidden="true"><Icon name="help" size={22}/></span>
                                        <h2>Help Center</h2>
                                        <div><strong>Need support?</strong><p>Contact HRBP for training questions or IT Support for access and technical issues.</p></div>
                                        <button className="dashboard-card-action" type="button" onClick={() => showToast("HRBP and IT support details are ready.")}>Get help <Icon name="chevron" size={16}/></button>
                                    </article>
                                </section>
                            </main>
                        </div>
                    ) : (
                        /* =========================================
                           NEW PAGE: DETAILED TRAINING WORKSPACE
                           ========================================= */
                        <div className="training-workspace flex-1 w-full bg-slate-50 animate-slide-in">
                            {/* Workspace Header / Banner */}
                            <div className="training-banner bg-white border-b border-slate-200">
                                <div className="training-banner-inner max-w-5xl mx-auto px-4 py-6">
                                    <button onClick={() => setPage('dashboard')} className="back-link flex items-center gap-2 text-sm font-medium text-slate-500 hover:text-indigo-600 transition-colors mb-4">
                                        <Icon name="arrowLeft" size={16}/> Back to Dashboard
                                    </button>
                                    
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
                                        <div>
                                            <div className="flex flex-wrap items-center gap-3 mb-2">
                                                <span className="training-status-badge px-2.5 py-1 bg-green-100 text-green-700 text-xs font-bold uppercase tracking-wider rounded">Status: {DEFAULT_TRAINING.status}</span>
                                                <span className="text-sm text-slate-500 font-medium">{DEFAULT_TRAINING.startDate} – {DEFAULT_TRAINING.endDate}</span>
                                                <span className="training-deadline-inline" aria-label={`${daysUntilDeadline} ${deadlineUnit} until the training deadline`}><Icon name="clock" size={15}/>{daysUntilDeadline} {deadlineUnit}</span>
                                            </div>
                                            <h1 className="training-title text-2xl md:text-3xl font-bold text-slate-800">{DEFAULT_TRAINING.title}</h1>
                                        </div>
                                        <div className="text-right shrink-0">
                                            <div className="text-sm font-semibold text-slate-500 mb-1">Your Progress</div>
                                            <div className="progress-display text-3xl font-bold text-indigo-700">{overallProgress}%</div>
                                        </div>
                                    </div>
                                </div>
                                
                                {/* Workspace Tabs */}
                                <div className="training-tabs max-w-5xl mx-auto px-4 flex overflow-x-auto">
                                    {[
                                        {id: 'overview', label: 'Overview'},
                                        {id: 'learning-path', label: 'Learning Path'},
                                        {id: 'certificate', label: 'Certificates'}
                                    ].map(tab => (
                                        <button key={tab.id} onClick={() => setTrainTab(tab.id)} className={`px-6 py-4 text-sm font-bold border-b-2 whitespace-nowrap transition-colors ${trainTab === tab.id ? 'border-indigo-600 text-indigo-700' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'}`}>
                                            {tab.label}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Workspace Content */}
                            <div className="training-content max-w-5xl mx-auto px-4 py-8 pb-20">
                                {trainTab === 'overview' && (
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                        <div className="md:col-span-2 space-y-8">
                                            <section>
                                                <h3 className="text-lg font-bold text-slate-800 mb-3">About this Training</h3>
                                                <p className="text-slate-600 leading-relaxed">This program builds the essential skills required to integrate AI-assisted workflows into customer operations safely, effectively, and empathetically. Designed specifically for {DEFAULT_EMPLOYEE.role}s.</p>
                                            </section>
                                            <section>
                                                <h3 className="text-lg font-bold text-slate-800 mb-3">Learning Objectives</h3>
                                                <ul className="space-y-2 text-slate-600 list-disc pl-5">
                                                    <li>Configure repeatable CRM workflows reducing manual routing.</li>
                                                    <li>Map repetitive service processes for responsible automation.</li>
                                                    <li>Apply insights to complex customer escalations.</li>
                                                </ul>
                                            </section>
                                        </div>
                                        <div className="space-y-4">
                                            <div className="training-info-card bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                                                <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Training Details</h4>
                                                <div className="space-y-4">
                                                    <div>
                                                        <div className="text-xs text-slate-500 mb-1">Department</div>
                                                        <div className="font-medium text-slate-800">{DEFAULT_TRAINING.department}</div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div className="deadline-countdown-card" aria-label={`${daysUntilDeadline} ${deadlineUnit} until the training deadline`}>
                                                <div className="deadline-countdown-label"><Icon name="calendar" size={18}/> Deadline countdown</div>
                                                <div className="deadline-countdown-value"><strong>{daysUntilDeadline}</strong><span>{deadlineUnit}</span></div>
                                                <p>Final training deadline · {DEFAULT_TRAINING.endDate}</p>
                                            </div>
                                            <button onClick={() => setTrainTab('learning-path')} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl shadow-sm transition-colors">Start Learning Path</button>
                                        </div>
                                    </div>
                                )}

                                {trainTab === 'learning-path' && (
                                    <div className="max-w-3xl space-y-10">
                                        <section>
                                            <h3 className="learning-section-title text-sm font-bold text-slate-800 uppercase tracking-wider mb-4 border-b border-slate-200 pb-2">Assigned Modules</h3>
                                            <div className="space-y-4">
                                                {MODULES.map(mod => {
                                                    const prog = calcModProgress(mod.id);
                                                    return (
                                                        <div key={mod.id} role="button" tabIndex="0" aria-expanded={activeModule?.id === mod.id} onKeyDown={(event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); setActiveModule(activeModule?.id === mod.id ? null : mod); } }} onClick={() => setActiveModule(activeModule?.id === mod.id ? null : mod)} className={`module-card group bg-white border border-slate-200 rounded-xl p-6 hover:border-indigo-400 hover:shadow-md transition-all cursor-pointer ${activeModule?.id === mod.id ? 'expanded' : ''}`}>
                                                            <div className="flex justify-between items-start mb-2">
                                                                <h4 className="font-bold text-slate-800 text-lg group-hover:text-indigo-700 transition-colors">{mod.title}</h4>
                                                                <span className={`text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded ${prog === 100 ? 'bg-green-100 text-green-700' : prog > 0 ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-100 text-slate-600'}`}>
                                                                    {prog === 100 ? 'Completed' : prog > 0 ? 'In Progress' : 'Not Started'}
                                                                </span>
                                                            </div>
                                                            <p className="text-sm text-slate-500 mb-5">{mod.description}</p>
                                                            <div className="flex items-center gap-4 text-xs font-medium text-slate-500 mb-5">
                                                                <span>{mod.skill}</span>
                                                                <span className="w-1 h-1 rounded-full bg-slate-300"></span>
                                                                <span>{mod.level}</span>
                                                                <span className="w-1 h-1 rounded-full bg-slate-300"></span>
                                                                <span>{mod.duration}</span>
                                                            </div>
                                                            <div className="flex items-center gap-3">
                                                                <div className="flex-1 bg-slate-100 rounded-full h-2">
                                                                    <div className={`h-2 rounded-full transition-all duration-500 ${prog === 100 ? 'bg-green-500' : 'bg-indigo-500'}`} style={{width: `${prog}%`}}></div>
                                                                </div>
                                                                <span className="text-xs font-bold text-slate-600 w-8 text-right">{prog}%</span>
                                                            </div>
                                                            {activeModule?.id === mod.id && (
                                                                <section className="inline-module-details" aria-label={`${mod.title} learning activities`} onClick={(event) => event.stopPropagation()} onKeyDown={(event) => event.stopPropagation()}>
                                                                    <div className="inline-module-heading">
                                                                        <div>
                                                                            <span className="inline-module-kicker">Module Details</span>
                                                                            <h5>Learning Activities</h5>
                                                                        </div>
                                                                        <span className="inline-module-progress">{prog}% Complete</span>
                                                                    </div>
                                                                    <div className="space-y-3">
                                                                        {mod.activities.map(act => {
                                                                            const isDone = progress[act.id];
                                                                            return (
                                                                                <div key={act.id} className={`activity-row border rounded-lg p-4 flex items-center justify-between transition-colors ${isDone ? 'border-slate-200 bg-slate-50' : 'border-slate-200 bg-white hover:border-indigo-400 cursor-pointer'}`} onClick={() => !isDone && (setActiveActivity(act), act.type==='Assignment' && setDraftText(localStorage.getItem(draftKey)||""))}>
                                                                                    <div className="flex items-center gap-4">
                                                                                        <div className={`w-8 h-8 rounded-full flex items-center justify-center shrink-0 ${isDone ? 'bg-green-100 text-green-600' : 'bg-indigo-50 text-indigo-600'}`}>
                                                                                            {isDone ? <Icon name="check" size={16}/> : act.type === 'Video' ? <Icon name="play" size={16}/> : act.type === 'Reading' ? <Icon name="file" size={16}/> : <Icon name="book" size={16}/>}
                                                                                        </div>
                                                                                        <div>
                                                                                            <div className={`font-semibold text-sm ${isDone ? 'text-slate-500 line-through' : 'text-slate-800'}`}>{act.title}</div>
                                                                                            <div className="text-xs text-slate-500 mt-0.5">{act.type} • {act.min} mins</div>
                                                                                            {Number.isFinite(act.score) && <div className={`activity-score ${isDone ? 'is-earned' : ''}`}>{isDone ? `Score ${act.score}/100` : "Score available after completion"}</div>}
                                                                                        </div>
                                                                                    </div>
                                                                                    {!isDone && <button type="button" className="text-xs font-bold text-indigo-600 hover:text-indigo-800 px-3 py-1.5 rounded bg-indigo-50" onClick={(event) => { event.stopPropagation(); setActiveActivity(act); if (act.type === 'Assignment') setDraftText(localStorage.getItem(draftKey)||""); }}>Start</button>}
                                                                                </div>
                                                                            );
                                                                        })}
                                                                    </div>
                                                                    <div className="flex justify-end mt-4"><button className="inline-module-close" type="button" onClick={() => setActiveModule(null)}>Hide activities</button></div>
                                                                </section>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </section>

                                    </div>
                                )}

                                {trainTab === 'certificate' && (
                                    <div className="max-w-3xl">
                                        <div className={`certificate-card ${overallProgress === 100 ? 'is-ready' : 'is-locked'}`}>
                                            <div className="certificate-icon"><Icon name={overallProgress === 100 ? "award" : "lock"} size={24} /></div>
                                            <div className="certificate-copy">
                                                <h4>Training Certificate</h4>
                                                <p>{overallProgress === 100 ? "Your certificate is ready to download." : `Complete all training activities first. Your current progress is ${overallProgress}%.`}</p>
                                            </div>
                                            <button type="button" className="certificate-download" disabled={overallProgress !== 100} onClick={() => overallProgress === 100 && window.print()}>{overallProgress === 100 ? "Download Certificate" : "Certificate Locked"}</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Activity Viewer Modal */}
                    {activeActivity && (
                        <div className="activity-modal-backdrop fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="activity-modal bg-white w-full max-w-3xl rounded-xl shadow-2xl flex flex-col max-h-[90vh]">
                                <div className="flex items-center justify-between p-5 border-b border-slate-200">
                                    <div className="flex items-center gap-3">
                                        <span className="bg-indigo-100 text-indigo-700 text-[10px] uppercase font-bold px-2 py-1 rounded">{activeActivity.type}</span>
                                        <h2 className="text-base font-bold text-slate-800">{activeActivity.title}</h2>
                                    </div>
                                    <button onClick={() => setActiveActivity(null)} className="text-slate-400 hover:text-slate-600"><Icon name="close" /></button>
                                </div>
                                <div className="p-6 flex-1 overflow-y-auto bg-slate-50">
                                    {activeActivity.type === 'Video' && (
                                        <div className="w-full aspect-video bg-black rounded-lg flex items-center justify-center relative group">
                                            <button className="video-play-button" type="button" aria-label={videoPlaying ? "Video is playing" : `Play ${activeActivity.title}`} disabled={videoPlaying} onClick={() => setVideoPlaying(true)}><Icon name="play" size={32} /></button>
                                            {!videoPlaying && <div className="absolute bottom-4 left-4 text-white text-sm">Video · {activeActivity.min} mins</div>}
                                            {videoPlaying && <div className="video-playback-status" role="status"><span>Playing…</span><div className="video-playback-progress"></div></div>}
                                        </div>
                                    )}
                                    {activeActivity.type === 'Reading' && (
                                        <div className="bg-white p-8 rounded-lg border border-slate-200 max-w-2xl mx-auto">
                                            <h3 className="text-xl font-bold mb-4">{activeActivity.title}</h3>
                                            <p className="mb-4 text-slate-600">This is a simulated reading document for the training portal.</p>
                                        </div>
                                    )}
                                    {activeActivity.type === 'Assignment' && (
                                        <div className="bg-white p-6 rounded-lg border border-slate-200">
                                            <h3 className="font-bold text-slate-800 mb-4">Submit your Process Map</h3>
                                            <textarea value={draftText} onChange={e => setDraftText(e.target.value)} className="w-full h-32 border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none resize-none" placeholder="Write your submission here..."></textarea>
                                            <div className="flex justify-end mt-4">
                                                <button onClick={() => { localStorage.setItem(draftKey, draftText); showToast("Draft saved."); }} className="text-sm text-indigo-600 font-medium px-4 py-2 hover:bg-indigo-50 rounded">Save Draft</button>
                                            </div>
                                        </div>
                                    )}
                                    {(activeActivity.type === 'Quiz' || activeActivity.type === 'Practice' || activeActivity.type === 'Case Study') && (
                                        <div className="bg-white p-8 rounded-lg border border-slate-200 text-center py-16">
                                            <div className="w-16 h-16 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="book" size={24} /></div>
                                            <h3 className="font-bold text-slate-800 mb-2">Interactive {activeActivity.type}</h3>
                                            <p className="text-sm text-slate-500">{activityStarted ? "Complete the activity when you are finished." : "Select Start below to begin this activity."}</p>
                                        </div>
                                    )}
                                    {Number.isFinite(activeActivity.score) && (
                                        <div className="activity-score-note" aria-label="Activity score information">
                                            <strong>Score</strong>
                                            <span>{activityStarted ? "Complete the activity to receive your score." : "Available after completion"}</span>
                                        </div>
                                    )}
                                </div>
                                <div className="p-4 border-t border-slate-200 bg-white flex justify-end gap-3">
                                    <button onClick={() => setActiveActivity(null)} className="px-5 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
                                    {activeActivity.type === 'Video' ? (
                                        <button onClick={() => setVideoPlaying(true)} disabled={videoPlaying} className="px-5 py-2 text-sm font-medium bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 shadow-sm">{videoPlaying ? "Playing…" : "Play"}</button>
                                    ) : activityStarted ? (
                                        <button onClick={() => markComplete(activeActivity.id, Number.isFinite(activeActivity.score) ? `Activity completed. Score: ${activeActivity.score}/100.` : "Activity completed.")} className="px-5 py-2 text-sm font-medium bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 shadow-sm">Complete Activity</button>
                                    ) : (
                                        <button onClick={() => setActivityStarted(true)} className="px-5 py-2 text-sm font-medium bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 shadow-sm">Start</button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TOASTS */}
                    {toast && (
                        <div className="toast-notice fixed bottom-6 right-6 bg-slate-800 text-white px-5 py-3 rounded-lg shadow-xl flex items-center gap-3 z-[100] animate-slide-in">
                            <Icon name="check" size={18} className="text-green-400" />
                            <span className="text-sm font-medium">{toast}</span>
                        </div>
                    )}

                    {/* PRINT-ONLY SUMMARY */}
                    <div className="hidden print-only p-8 text-black bg-white absolute inset-0 z-[200]">
                        <h1 className="text-3xl font-bold mb-2">Training Record</h1>
                        <h2 className="text-xl mb-6">{DEFAULT_TRAINING.title}</h2>
                        <div className="mb-8 flex gap-12">
                            <div><strong>Employee:</strong> {DEFAULT_EMPLOYEE.name}</div>
                            <div><strong>Overall Progress:</strong> {overallProgress}%</div>
                        </div>
                        <h3 className="text-lg font-bold border-b border-black pb-2 mb-4">Assigned Modules</h3>
                        {MODULES.map(m => (
                            <div key={m.id} className="mb-4">
                                <div className="font-bold flex justify-between"><span>{m.title}</span> <span>{calcModProgress(m.id)}%</span></div>
                                <div className="text-sm mt-1">
                                    {m.activities.map(a => (
                                        <div key={a.id} className="flex justify-between pl-4">
                                            <span>- {a.title} ({a.type})</span>
                                            <span>{progress[a.id] ? 'Completed' : 'Pending'}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                        {overallProgress === 100 && (
                            <div className="mt-12 text-center border-t-2 border-black pt-8">
                                <h2 className="text-2xl font-bold">CERTIFICATE OF COMPLETION</h2>
                                <p className="mt-4">Awarded to {DEFAULT_EMPLOYEE.name} for successful completion.</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
